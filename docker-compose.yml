version: '3.8'

services:
  rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-chatbot
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - hf_cache:/root/.cache/huggingface
      - .:/app
    restart: unless-stopped

volumes:
  hf_cache: